{% extends "base.html" %}
{% block title %}
    login
{% endblock %}
{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style/auth.css') }}">
{% endblock %}

{% block content %}
<h1>Login</h1>
<form action="{{ url_for('login') }}" method="POST">
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <label for="name">Namn:</label>
    <input type="text" id="name" name="name" value="{{ name|default('') }}" required>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ email|default('') }}" required>
    <label for="phone">Telefon:</label>
    <input type="tel" id="phone" name="phone" value="{{ phone|default('') }}" required>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <input type="submit" value="Login">
</form>

<p><a href="{{ url_for('forgot_password') }}">Glömt lösenord?</a></p>

{% endblock %}
